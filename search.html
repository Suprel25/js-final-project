<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/abd097e172.js" crossorigin="anonymous"></script>
    <script src="search.js" defer></script>
    <title>Document</title>
</head>
<body id="search__body">
    <section id="landing-page">
        <div>
         <i class="fas fa-spinner loading-spinner" ></i>  
        </div>
        <nav class="nav container search__nav--container">
            <img class="logo" src="Red Ribbon M App Icon.jpeg" alt="">
            <div class="action__container">
                <button class="sign-in__button back__button" onclick="goBack()" ><i class="fa-solid fa-left-long"></i></button>
            </div>
        </nav>
        <div class="filter__container">
            <select id="filter">
            <option value="" disabled selected>Sort</option> 
            <option value="A_Z">A-Z</option> 
            <option value="Z_A">Z-A</option> 
            </select>
        </div>    
        <div class="search__row row">
            <div class="search__container container">
                <div class="search__wrapper movie-list">
                    <div class="search__results movies-card">
                        <div class="movies-card__container">
                            <div class="movie-img__wrapper">
                                <img class="search__results--img" src="">
                            </div>
                            <p class="title">
                            <p class="year"></p>
                            <p class="type"></p>
                        </div>    
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
